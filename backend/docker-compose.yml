# Postgres para desenvolvimento local. As credenciais vêm do backend/.env
# (o docker compose lê esse arquivo automaticamente para substituir as variáveis).
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no backend/.env}
      POSTGRES_DB: ${DB_NAME:-lumen_db}
    ports:
      # Só acessível pela própria máquina, não pela rede local.
      - "127.0.0.1:5432:5432"
