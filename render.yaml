services:
  - type: web
    name: lumen-backend
    runtime: node
    rootDir: backend
    plan: free
    # As migrações rodam no boot do servidor (src/index.js), antes de aceitar requisições.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lumen-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      # Domínios do frontend autorizados a chamar a API (separados por vírgula).
      - key: CORS_ORIGINS
        value: https://lumenm.web.app,https://lumenm.firebaseapp.com

databases:
  - name: lumen-db
    databaseName: lumen
    user: lumen
    plan: free
