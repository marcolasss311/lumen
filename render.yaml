services:
  - type: web
    name: lumen-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && node src/db/initDb.js
    startCommand: node src/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lumen-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false

databases:
  - name: lumen-db
    databaseName: lumen
    user: lumen
    plan: free
